function vRefForm(){const r=S.refE;const c=r&&charById(r.cid);if(!r||!c)return hdr('基準画像')+'<div class="empty">キャラが見つかりません</div>';const g=r.g||{};const fr=Array.isArray(g.free)?g.free:[];

${spRadio('spG',g.sp==='private'||g.sp==='reveal'?g.sp:'','この基準画像の表示')}
<button class="btn" ${S.busy?'disabled':''}>${S.busy?'保存中…':'保存する'}</button></form>`}
async function ensureRow(cid){const c=charById(cid);if(!c||c.owner!==S.me)throw{code:'invalid_argument'};if(S.chrRows.some(x=>x.id===cid))return c;const{id,owner,legacy,...rest}=c;await S.db.doc('chr/'+cid).set({owner:S.me,...rest,pubAt:rest.pubAt||0,at:rest.at||Date.now(),upd:Date.now()});try{if(S.charIdx[S.me]&&S.charIdx[S.me][cid])await dropItem('chidx',cid);if(legacy)await S.db.doc('chars/'+cid).delete()}catch(e){}return c}
async function saveRefs(cid,fn){const c=await ensureRow(cid);let list=fn(refGroups(c).map(g=>({...g})));list=list.slice(0,10).map((g,i)=>({...g,pos:i}));const pub=list.filter(g=>g.sp!=='private'),pv=list.filter(g=>g.sp==='private').map(({sp,...g})=>g);
const pp='data/users/'+S.me+'/cp_'+cid;const cur={...(S.cpriv[cid]||{})};if(pv.length)cur.prefs=pv;else delete cur.prefs;if(Object.keys(cur).length)await S.db.doc(pp).set(cur);else if(S.cpriv[cid])await S.db.doc(pp).delete();await S.db.doc('chr/'+cid).update({refs:pub})}

async function submitRef(){if(S.busy||!can())return;const r=S.refE;const c0=r&&charById(r.cid);if(!c0||c0.owner!==S.me)return;const ks=['face','body','f0','f1','f2','f3'];if(!ks.some(k=>r.im[k]))return toast('画像を1枚以上選んでね');if(ks.some(k=>r.im[k]&&r.im[k].blob)&&!S.assets)return toast('この表示では画像をアップロードできません');
const name=val('rgn').slice(0,20)||'基準画像',memo=val('rgm').slice(0,200);const spv=rval('spG');const sp=['reveal','private'].includes(spv)?spv:'';const labels=[0,1,2,3].map(i=>val('rfl'+i).slice(0,10));
S.busy=true;render();const up={};try{for(const k of ks)up[k]=await upOne(r.im[k])}catch(e){S.busy=false;render();return toast('画像をアップロードできませんでした')}

const ok=await W(()=>saveRefs(r.cid,l=>{const i=l.findIndex(x=>x.id===gid);if(i>=0)l[i]=grp;else l.push(grp);return l}));S.busy=false;if(ok){S.refE=null;ACT.back();toast('基準画像を保存しました')}else render()}

const USEL={all:'誰でも',follow:'フォロワーだけ',none:'使用不可'};
const cosById=id=>S.cosAll.find(x=>x.id===id);
const cosUse=k=>['all','follow','none'].includes(k&&k.use)?k.use:'all';
function canUseCos(k){if(!k)return false;if(k.owner===S.me)return true;const u=cosUse(k);return u==='all'||u==='follow'&&!!S.me&&S.follows.some(f=>f.from===S.me&&f.to===k.owner)}
function cosCard(k){const im=imgs(k);const f=k.card&&k.card.asset&&im[0]&&k.card.from===im[0].asset?{asset:k.card.asset}:im[0];const u=cosUse(k);return`<button class="chc" data-act="cos" data-id="${esc(k.id)}"><div class="im" style="position:relative">${f?`<img src="${src(f.t||f.asset)}" alt="" loading="lazy">`:''}${u!=='all'?`<span class="ai">${USEL[u]}</span>`:''}</div><div class="tx">${S.view==='home'&&S.tab==='follow'&&S.mode==='cos'&&S._rpCos&&S._rpCos.has(k.id)&&!D.fol.has(k.owner)?rpLabel(S._rpCos.get(k.id).by):''}<b>${esc(k.name)}</b><small>${esc(nm(k.owner))}${D.cuse&&D.cuse[k.id]?` ・ ${D.cuse[k.id]}作品`:''}</small></div></button>`}

function cosList(tb){let l=S.cos.slice();let hint='',empty='';
if(tb==='follow'){const rm=rpFeed('cos');l=l.filter(k=>D.fol.has(k.owner)||rm.has(k.id)).map(k=>({k,at:Math.max(k.at||0,rm.has(k.id)?rm.get(k.id).at:0)})).sort((a,b)=>b.at-a.at).map(x=>x.k);S._rpCos=rm;hint='フォロー中の人の衣装と、リポストされた衣装（新しい順）';empty='<div class="empty"><b>まだ何もありません</b>フォロー中の人が衣装を登録すると、ここに並びます</div>'}

else if(tb==='pop'){const t=rkStart(),sc={};S.likes.forEach(x=>{if((x.at||0)>=t&&typeof x.post==='string'&&x.post.startsWith('cs:'))sc[x.post.slice(3)]=(sc[x.post.slice(3)]||0)+1});S.posts.forEach(p=>{if((p.at||0)>=t)(Array.isArray(p.cos)?p.cos:[]).forEach(id=>sc[id]=(sc[id]||0)+1)});l=l.filter(k=>sc[k.id]).sort((a,b)=>sc[b.id]-sc[a.id]);hint=RKL[S.rk]+'ランキング：'+RKH[S.rk]+'のいいねと、その衣装で描かれた作品が多い順';empty='<div class="empty"><b>'+RKH[S.rk]+'はまだ動きがありません</b>気に入った衣装にいいねしたり、その衣装で描いてみよう</div>'}
else if(tb==='comm'){l=l.filter(k=>k.community&&D.joined.has(k.community)).sort(newest);hint='参加中のコミュニティの衣装（新しい順）';empty='<div class="empty"><b>まだ何もありません</b>「探す」からコミュニティに参加すると、そこに登録された衣装が並びます</div>'}
else{const tw={};S.posts.filter(p=>D.my.has(p.id)).forEach(p=>(p.tags||[]).forEach(t=>tw[t]=(tw[t]||0)+1));S.cos.filter(k=>D.my.has('cs:'+k.id)).forEach(k=>(k.tags||[]).forEach(t=>tw[t]=(tw[t]||0)+2));if(!S.nseed)S.nseed=Date.now();const sc=k=>{let v=1;(k.tags||[]).forEach(t=>v+=tw[t]||0);if(D.fol.has(k.owner))v+=2;v+=Math.log(1+(D.lc['cs:'+k.id]||0)+(D.cuse[k.id]||0));return v*(0.4+(hash(k.id+S.nseed)%1000)/1000*1.2)};l=l.filter(k=>k.owner!==S.me).map(k=>[k,sc(k)]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);hint=Object.keys(tw).length?'いいねした作品や衣装のタグから選んでいます':'開くたびに少しずつ違う並びで紹介しています'}

function vCos(){if(!S.loaded)return hdr('')+loading();const k=cosById(S.kid);const mine=k&&k.owner===S.me;const h=hdr('衣装',mine?`<span style="display:flex"><button class="ib" data-act="editCos" data-id="${esc(k.id)}" aria-label="衣装を編集">${IC.edit}</button><button class="ib" data-act="del" data-id="cos:${esc(k.id)}" aria-label="この衣装を削除">${IC.trash}</button></span>`:flagBtn('cos',k&&k.id,k&&k.owner));

L(db.collection('rp'),s=>{S.rps=rows(s).filter(x=>x.user&&x.target&&['post','st','cos'].includes(x.k));rebuild()});
L(db.collection('rv'),s=>{S.rvs=rows(s).filter(x=>x.user&&x.story&&[1,2,3].includes(Number(x.stars))).map(x=>({...x,stars:Number(x.stars)}));rebuild()});
L(db.collection('site'),s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.site=o});
L(db.collection('bans'),s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data()||{});S.bans=o;S.banSet=new Set(Object.keys(o));applyFilters();rebuild()});
L(db.collection('cos'),s=>{S.cosRows=rows(s).filter(k=>k.owner&&k.name);rebuild()});
L(db.collection('cosp'),s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.cosp=o});
L(db.collection('odai'),s=>{S.odaiRows=rows(s).filter(o=>o.owner&&o.title);rebuild()});
L(db.collection('handles'),s=>{const h={},o={};s.docs.forEach(d=>{const v=d.data();if(v&&typeof v.owner==='string'&&HRE.test(d.id)){h[d.id]=v.owner;if(!o[v.owner]||d.id<o[v.owner])o[v.owner]=d.id}});S.handles=h;S.hOf=o;if(!s.metadata.fromCache)S.ld.handles=true});
L(db.collection('board').orderBy('at','asc'),s=>{S.rawBoard=rows(s)});
if(S.isOwner){L(db.collection('reports'),s=>{const a=[];s.docs.forEach(d=>{const v=d.data();if(v&&v.items&&typeof v.items==='object')for(const[id,r]of Object.entries(v.items))if(r&&RKIND[r.kind])a.push({...r,id,by:d.id})});S.allReports=a.sort((x,y)=>(y.at||0)-(x.at||0))});L(db.collection('reportStatus'),s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.rstat=o});L(db.collection('contact'),s=>{const a=[];s.docs.forEach(d=>{const v=d.data();if(v&&typeof v.body==='string')a.push({...v,id:d.id,at:Number(v.at)||0})});S.contacts=a.sort((x,y)=>y.at-x.at)})}
if(S.me)db.doc('reports/'+S.me).onSnapshot(s=>{const v=s.exists?s.data():null;S.myReports=v&&v.items&&typeof v.items==='object'?v.items:{}},()=>{});
if(S.me){L(db.collection('data/users/'+S.me),s=>{const o={};s.docs.forEach(d=>{if(d.id.startsWith('cp_'))o[d.id.slice(3)]=d.data()});S.cpriv=o;const q={};s.docs.forEach(d=>{if(d.id.startsWith('sp_'))q[d.id.slice(3)]=d.data()});S.spriv=q;const a={},b={},rp={};let mm=[];s.docs.forEach(d=>{if(d.id.startsWith('pp_'))a[d.id.slice(3)]=d.data();else if(d.id.startsWith('csp_'))b[d.id.slice(4)]=d.data();else if(d.id.startsWith('rel_'))rp[d.id.slice(4)]=d.data();else if(d.id==='read'){const v=d.data();if(v&&v.r&&typeof v.r==='object'){const loc=S.readP;const m={...v.r};for(const k in loc)if(!m[k]||(loc[k].at||0)>(m[k].at||0))m[k]=loc[k];S.readP=m}}else if(d.id==='bmn'){const v=d.data();S.bmOff=new Set(v&&Array.isArray(v.off)?v.off:[])}else if(d.id==='push'){S.pushDoc=d.data()||null}else if(d.id==='saves'){const v=d.data()||{};S.saves={folders:Array.isArray(v.folders)?v.folders.filter(f=>f&&f.id&&typeof f.name==='string'):[],items:Array.isArray(v.items)?v.items.filter(x=>x&&['post','cos','chr'].includes(x.k)&&x.id):[]}}else if(d.id==='memo'){const v=d.data();mm=v&&Array.isArray(v.items)?v.items.filter(x=>x&&typeof x.t==='string'):[]}});S.ppriv=a;S.cspriv=b;S.memo=mm;S.relPriv=rp;relSyncSoon()});db.doc('data/users/'+S.me+'/state').onSnapshot(s=>{const d=s.exists?s.data():{};const v=Number(d.seen)||0;let ch=false;if(v>S.seen){S.seen=v;ch=true}if(d.dm&&typeof d.dm==='object'){for(const k in d.dm)if(Number(d.dm[k])>(S.dmRead[k]||0)){S.dmRead={...S.dmRead,[k]:Number(d.dm[k])};ch=true}}if(BGS.includes(d.bg)&&d.bg!==S.bg){setBg(d.bg,false);ch=true}if(typeof d.ac==='string'&&HEX.test(d.ac.toUpperCase())&&d.ac.toUpperCase()!==AC){setAc(d.ac,false);ch=true}
if(typeof d.adult==='boolean'&&d.adult!==S.adult){S.adult=d.adult;try{localStorage.setItem('imagi_adult',d.adult?'1':'0')}catch(e){}ch=true}if(typeof d.blur==='boolean'&&d.blur!==S.blur){S.blur=d.blur;ch=true}if(typeof d.promptDef==='boolean'&&d.promptDef!==S.promptDef){S.promptDef=d.promptDef;ch=true}
if(d.nOn&&typeof d.nOn==='object'){const n={...S.nOn};for(const k in n)if(typeof d.nOn[k]==='boolean')n[k]=d.nOn[k];if(JSON.stringify(n)!==JSON.stringify(S.nOn)){S.nOn=n;ch=true}}
for(const k of['mutes','blocks'])if(Array.isArray(d[k])){const v=d[k].filter(x=>typeof x==='string').slice(0,200);if(JSON.stringify(v)!==JSON.stringify(S[k])){S[k]=v;ch=true}}
if(ch){applyFilters();rebuild()}if(ch&&!isForm())render()},()=>{});
L(db.collection('dms').where('users','array-contains',S.me).orderBy('at','asc'),s=>{S.rawDms=rows(s).filter(m=>Array.isArray(m.users)&&m.users.length===2&&m.users.includes(m.from)&&typeof m.iv==='string'&&typeof m.ct==='string')});initKeys()}}
init();
}
