async function shrink(file,CW,CH){const u=URL.createObjectURL(file);try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});const iw=im.naturalWidth,ih=im.naturalHeight;let w,h,dx=0,dy=0,dw,dh;if(CW){w=CW;h=CH;const k=Math.max(CW/iw,CH/ih);dw=iw*k;dh=ih*k;dx=(CW-dw)/2;dy=(CH-dh)/2}else{const r=Math.min(1,1600/Math.max(iw,ih));w=Math.max(1,Math.round(iw*r));h=Math.max(1,Math.round(ih*r));dw=w;dh=h}const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#0F1115';x.fillRect(0,0,w,h);x.drawImage(im,dx,dy,dw,dh);const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',.88));if(!blob)throw 0;let tblob=null;if(!CW){const k=Math.min(1,640/Math.max(w,h));if(k<1){const t=document.createElement('canvas');t.width=Math.round(w*k);t.height=Math.round(h*k);t.getContext('2d').drawImage(c,0,0,t.width,t.height);tblob=await new Promise(res=>t.toBlob(res,'image/jpeg',.82))}}return{blob,tblob,url:URL.createObjectURL(blob),w,h}}finally{URL.revokeObjectURL(u)}}

async function initKeys(){if(!S.me||S.readOnly)return;if(!window.crypto||!crypto.subtle){S.noCrypto=true;return}try{const ref=S.db.doc('data/users/'+S.me+'/keys');const s=await ref.get();const d=s.exists?s.data():null;if(d&&d.priv&&d.pub){MYK=await crypto.subtle.importKey('jwk',d.priv,EC,false,['deriveKey']);S.myPubJ=d.pub}else{const kp=await crypto.subtle.generateKey(EC,true,['deriveKey']);const priv=await crypto.subtle.exportKey('jwk',kp.privateKey),pub=await crypto.subtle.exportKey('jwk',kp.publicKey);await ref.set({priv,pub});MYK=kp.privateKey;S.myPubJ={kty:pub.kty,crv:pub.crv,x:pub.x,y:pub.y}}syncPub();decryptAll()}catch(e){S.noCrypto=true;if(!isForm())render()}}
let pubBusy=false;async function syncPub(){const p=S.profiles[S.me];const m=S.myPubJ;if(!p||!m||pubBusy||(p.pub&&p.pub.x===m.x&&p.pub.y===m.y))return;pubBusy=true;try{await S.db.doc('profiles/'+S.me).update({pub:{kty:m.kty,crv:m.crv,x:m.x,y:m.y}})}catch(e){}pubBusy=false}
async function keyFor(uid){const p=S.profiles[uid]&&S.profiles[uid].pub;if(!p||!MYK||!p.x)return null;const k=uid+':'+p.x;if(!KC[k])KC[k]=crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:p.x,y:p.y},EC,false,[]).then(pk=>crypto.subtle.deriveKey({name:'ECDH',public:pk},MYK,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])).catch(()=>null);return KC[k]}
let decBusy=false;async function decryptAll(){if(!MYK||decBusy)return;decBusy=true;let ch=false;for(const m of S.dms){if(S.dmPlain[m.id]!==undefined)continue;const o=m.users.find(u=>u!==S.me);const k=await keyFor(o);if(!k)continue;try{S.dmPlain[m.id]=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(m.iv)},k,ub64(m.ct)))}catch(e){S.dmPlain[m.id]=null}ch=true}decBusy=false;if(ch&&!isForm())render()}
async function sendDM(){if(!can())return;const o=S.dmWith,t=val('dmi');if(!t||!o)return;const why=canDmTo(o);if(why)return toast(why);const k=await keyFor(o);if(!k)return toast('まだこの相手には送れません');const el=document.getElementById('dmi');el.value='';
try{const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(t.slice(0,1000)));const ref=S.db.collection('dms').doc();S.dmPlain[ref.id]=t.slice(0,1000);if(!await W(()=>ref.set({users:[S.me,o].sort(),from:S.me,iv:b64(iv),ct:b64(ct),at:Date.now()}))){const e2=document.getElementById('dmi');if(e2)e2.value=t}}catch(e){toast('送信できませんでした')}}
async function names(){if(!S.user)return;const ids=[...new Set([...S.posts.map(p=>p.author),...S.comments.map(c=>c.author),...S.follows.map(f=>f.from),...S.chars.map(c=>c.owner),...S.stories.map(x=>x.owner),...S.members.map(m=>m.user),...S.board.map(b=>b.author),...S.dms.flatMap(m=>m.users)])].filter(id=>typeof id==='string'&&!(id in S.pnames));if(!ids.length)return;ids.forEach(id=>S.pnames[id]='');const ps=await S.user.profiles(ids);let ch=false;for(const id of ids)if(ps[id]&&ps[id].name){S.pnames[id]=ps[id].name;ch=true}if(ch&&!isForm())render()}
function after(){applyFilters();names();if(S.me&&S.gotProfiles&&!S.profiles[S.me]&&!S.readOnly&&!S.setupShown&&S.view==='home'){S.setupShown=true;S.hist.push({view:'home'});S.view='setup';return render()}if(S.view==='notif'){derive();markSeen()}syncPub();decryptAll();markThread();if(!isForm())render()}
function makeDB(){const cache=new Map(),subs=new Set();let ready=false,nt=0;
const collOf=p=>p.slice(0,p.lastIndexOf('/')),idOf=p=>p.slice(p.lastIndexOf('/')+1);
const meta=()=>({fromCache:!ready,hasPendingWrites:false});
const snap=p=>({id:idOf(p),exists:cache.has(p),data:()=>cache.get(p),metadata:meta()});
const notify=()=>{if(nt)return;nt=setTimeout(()=>{nt=0;for(const f of[...subs])try{f()}catch(e){console.error(e)}},20)};
const norm=e=>{const c=e&&e.code;return c==='42501'?{code:'invalid_argument'}:c==='23514'?{code:'too_big'}:{code:'unavailable',message:e&&e.message}};
function run(q){let a=[];for(const[p,d]of cache)if(collOf(p)===q.coll)a.push([p,d]);for(const[f,op,v]of q.wh)a=a.filter(([,d])=>{const x=d&&d[f];return op==='array-contains'?Array.isArray(x)&&x.includes(v):op==='=='?x===v:op==='!='?x!==v:true});
if(q.ord){const[f,dir]=q.ord;a.sort((A,B)=>{const x=A[1][f],y=B[1][f];const c=x===y?0:x===undefined?1:y===undefined?-1:x<y?-1:1;return dir==='desc'?-c:c})}else a.sort((A,B)=>A[0]<B[0]?-1:1);if(q.lim)a=a.slice(0,q.lim);const docs=a.map(([p])=>snap(p));return{docs,size:docs.length,empty:!docs.length,metadata:meta(),docChanges:()=>[]}}
function D(p){const ref={id:idOf(p),path:p,
get:async()=>{if(!ready){const{data,error}=await sb.from('docs').select('data').eq('path',p).maybeSingle();if(error)throw norm(error);if(data)cache.set(p,data.data);else cache.delete(p)}return snap(p)},
onSnapshot(next){const f=()=>{if(ready)next(snap(p))};subs.add(f);if(ready)setTimeout(f,0);return()=>subs.delete(f)},
async set(data){const v=JSON.parse(JSON.stringify(data));const had=cache.has(p),prev=cache.get(p);cache.set(p,v);notify();const{error}=await sb.from('docs').upsert({path:p,data:v});if(error){if(had)cache.set(p,prev);else cache.delete(p);notify();throw norm(error)}},
async update(data){const cur=cache.get(p);if(!cur)throw{code:'invalid_argument'};const m=(a,b)=>{const o={...a};for(const k in b)o[k]=b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])?m(a[k],b[k]):b[k];return o};return ref.set(m(cur,data))},
async delete(){const had=cache.has(p),prev=cache.get(p);cache.delete(p);notify();const{data,error}=await sb.from('docs').delete().eq('path',p).select('path');if(error||had&&(!data||!data.length)){if(had)cache.set(p,prev);notify();throw error?norm(error):{code:'invalid_argument'}}},
collection:c=>Q(p+'/'+c)};return ref}
function Q(coll,wh=[],ord=null,lim=0){return{path:coll,where:(f,op,v)=>Q(coll,[...wh,[f,op,v]],ord,lim),orderBy:(f,d='asc')=>Q(coll,wh,[f,d],lim),limit:n=>Q(coll,wh,ord,n),
get:async()=>run({coll,wh,ord,lim}),onSnapshot(next){const f=()=>{if(ready)next(run({coll,wh,ord,lim}))};subs.add(f);if(ready)setTimeout(f,0);return()=>subs.delete(f)},
doc:id=>D(coll+'/'+(id||newId())),add:async data=>{const r=D(coll+'/'+newId());await r.set(data);return r}}}
async function load(){const m=new Map();for(let from=0;;from+=1000){const{data,error}=await sb.from('docs').select('path,data').not('path','like','epbody/%').order('path').range(from,from+999);if(error)throw error;data.forEach(r=>m.set(r.path,r.data));if(data.length<1000)break}cache.clear();m.forEach((v,k)=>cache.set(k,v));ready=true;notify()}
function live(){sb.channel('imagi-docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},pl=>{if(pl.eventType==='DELETE'){const p=pl.old&&pl.old.path;if(p&&cache.delete(p))notify()}else if(pl.new&&pl.new.path){if(pl.new.path.startsWith('epbody/'))return;cache.set(pl.new.path,pl.new.data);notify()}}).subscribe()}
return{doc:D,collection:c=>Q(c),load,live}}
async function init(){if(!window.supabase||!window.supabase.createClient){S.nodb=true;return render()}const timer=setTimeout(()=>{if(!S.loaded){S.slow=true;render()}},10000);
sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let ses=null;try{ses=(await sb.auth.getSession()).data.session}catch(e){}S.me=ses&&ses.user?ses.user.id:null;S.email=ses&&ses.user?ses.user.email||'':'';
sb.auth.onAuthStateChange((ev,se)=>{const id=se&&se.user?se.user.id:null;if(id!==S.me)setTimeout(()=>location.reload(),50)});
if(S.me){try{const r=await sb.rpc('is_admin');S.isOwner=!!r.data}catch(e){}}
const db=makeDB();S.db=db;S.user={id:async()=>S.me,isOwner:async()=>S.isOwner,can:async()=>!!S.me,profiles:async()=>({})};
S.assets=S.me?{upload:async blob=>{const path=S.me+'/'+newId()+'.jpg';const{error}=await sb.storage.from('images').upload(path,blob,{contentType:blob.type||'image/jpeg',cacheControl:'31536000',upsert:false});if(error)throw error;return{id:path,url:src(path)}},delete:async id=>{if(typeof id==='string'&&id.includes('/'))await sb.storage.from('images').remove([id])}}:null;
const user=S.user;if(!S.me)S.readOnly=true;openRoute();render();
db.live();db.load().catch(()=>{clearTimeout(timer);S.loaded=true;toast('データを読み込めませんでした')});
setInterval(()=>{const now=Date.now();const due=[...S.myFuture,...S.myFutureChars].some(x=>Number(x.pubAt)<=now)||S.eps.some(e=>e.pubAt&&Number(e.pubAt)<=now&&Number(e.pubAt)>now-30e3);if(due){applyFilters();rebuild();if(!isForm())render()}},15000);
setInterval(()=>{if(!document.hidden)db.load().catch(()=>{})},300000);
window.addEventListener('scroll',()=>{const h=document.querySelector('.top.stk');if(h)h.classList.toggle('sh',scrollY>4)},{passive:true});
let hid=0;document.addEventListener('visibilitychange',()=>{if(document.hidden){hid=Date.now()}else if(hid&&Date.now()-hid>60000){db.load().catch(()=>{})}});

const fail=()=>{clearTimeout(timer);S.loaded=true;toast('データを読み込めませんでした')};
const L=(q,fn)=>q.onSnapshot(s=>{fn(s);after()},fail);const rows=s=>s.docs.map(d=>({...d.data(),id:d.id}));
L(db.collection('profiles'),s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.profiles=o;if(!s.metadata.fromCache)S.gotProfiles=true});
L(db.collection('posts').orderBy('at','desc').limit(500),s=>{S.rawPosts=rows(s).filter(p=>p.author&&imgs(p).length);S.loaded=true;if(!s.metadata.fromCache){clearTimeout(timer);S.slow=false}});
L(db.collection('likes'),s=>{S.likes=s.docs.map(d=>d.data())});
L(db.collection('follows'),s=>{S.follows=s.docs.map(d=>d.data())});
L(db.collection('comments').orderBy('at','asc').limit(1000),s=>{S.rawComments=rows(s)});
const ldk=(k,s)=>{if(!s.metadata.fromCache)S.ld[k]=true;rebuild();migrate()};
L(db.collection('chars').orderBy('at','desc').limit(500),s=>{S.charsOld=rows(s).filter(c=>c.owner&&c.name);ldk('chars',s)});
L(db.collection('chr').limit(1000),s=>{S.chrRows=rows(s);ldk('chr',s)});
L(db.collection('chidx'),s=>{const o={};s.docs.forEach(d=>{const v=d.data();o[d.id]=v&&v.items||{}});S.charIdx=o;ldk('chidx',s)});
L(db.collection('eps').limit(1000),s=>{S.eps=rows(s).filter(e=>e.author&&e.story)});
L(db.collection('stidx'),s=>{const o={};s.docs.forEach(d=>{const v=d.data();o[d.id]=v&&v.items||{}});S.stIdx=o;ldk('stidx',s)});
L(db.collection('cidx'),s=>{const o={};s.docs.forEach(d=>{const v=d.data();o[d.id]=v&&v.items||{}});S.commIdx=o;ldk('cidx',s)});
L(db.collection('comms').orderBy('at','desc').limit(200),s=>{S.commsOld=rows(s).filter(c=>c.owner&&c.name);ldk('comms',s)});
L(db.collection('members').limit(1000),s=>{S.members=s.docs.map(d=>d.data())});
L(db.collection('board').orderBy('at','asc').limit(1000),s=>{S.rawBoard=rows(s)});
if(S.isOwner){L(db.collection('reports'),s=>{const a=[];s.docs.forEach(d=>{const v=d.data();if(v&&v.items&&typeof v.items==='object')for(const[id,r]of Object.entries(v.items))if(r&&RKIND[r.kind])a.push({...r,id,by:d.id})});S.allReports=a.sort((x,y)=>(y.at||0)-(x.at||0))});L(db.collection('reportStatus'),s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.rstat=o})}
if(S.me)db.doc('reports/'+S.me).onSnapshot(s=>{const v=s.exists?s.data():null;S.myReports=v&&v.items&&typeof v.items==='object'?v.items:{}},()=>{});
if(S.me){L(db.collection('data/users/'+S.me),s=>{const o={};s.docs.forEach(d=>{if(d.id.startsWith('cp_'))o[d.id.slice(3)]=d.data()});S.cpriv=o;const q={};s.docs.forEach(d=>{if(d.id.startsWith('sp_'))q[d.id.slice(3)]=d.data()});S.spriv=q});db.doc('data/users/'+S.me+'/state').onSnapshot(s=>{const d=s.exists?s.data():{};const v=Number(d.seen)||0;let ch=false;if(v>S.seen){S.seen=v;ch=true}if(d.dm&&typeof d.dm==='object'){for(const k in d.dm)if(Number(d.dm[k])>(S.dmRead[k]||0)){S.dmRead={...S.dmRead,[k]:Number(d.dm[k])};ch=true}}if(BGS.includes(d.bg)&&d.bg!==S.bg){setBg(d.bg,false);ch=true}
if(typeof d.adult==='boolean'&&d.adult!==S.adult){S.adult=d.adult;try{localStorage.setItem('imagi_adult',d.adult?'1':'0')}catch(e){}ch=true}if(typeof d.blur==='boolean'&&d.blur!==S.blur){S.blur=d.blur;ch=true}if(typeof d.promptDef==='boolean'&&d.promptDef!==S.promptDef){S.promptDef=d.promptDef;ch=true}
if(d.nOn&&typeof d.nOn==='object'){const n={...S.nOn};for(const k in n)if(typeof d.nOn[k]==='boolean')n[k]=d.nOn[k];if(JSON.stringify(n)!==JSON.stringify(S.nOn)){S.nOn=n;ch=true}}
for(const k of['mutes','blocks'])if(Array.isArray(d[k])){const v=d[k].filter(x=>typeof x==='string').slice(0,200);if(JSON.stringify(v)!==JSON.stringify(S[k])){S[k]=v;ch=true}}
if(ch){applyFilters();rebuild()}if(ch&&!isForm())render()},()=>{});
L(db.collection('dms').where('users','array-contains',S.me).orderBy('at','asc').limit(1000),s=>{S.rawDms=rows(s).filter(m=>Array.isArray(m.users)&&m.users.length===2&&m.users.includes(m.from)&&typeof m.iv==='string'&&typeof m.ct==='string')});initKeys()}}
init();
}
